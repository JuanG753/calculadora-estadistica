<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Hipótesis - 2 Poblaciones</title>
    <!-- Usamos Bootstrap para el diseño móvil -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Usamos jStat para calcular el Valor P y Z exactos -->
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .step-title { color: #0d6efd; font-weight: bold; }
        .result-box { background-color: #e9ecef; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 1.1em;}
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4 text-primary">Prueba de Hipótesis (2 Poblaciones)</h2>
        
        <div class="card p-4">
            <h5 class="mb-3">Ingreso de Datos</h5>
            
            <div class="row g-3">
                <!-- Datos Población 1 -->
                <div class="col-md-6">
                    <div class="p-3 border rounded bg-light">
                        <h6 class="text-secondary">Población 1</h6>
                        <label>Media (x̄₁)</label>
                        <input type="number" id="media1" class="form-control mb-2" step="any">
                        <label>Varianza (σ₁² o S₁²)</label>
                        <input type="number" id="var1" class="form-control mb-2" step="any">
                        <label>Tamaño (n₁)</label>
                        <input type="number" id="n1" class="form-control" step="any">
                    </div>
                </div>

                <!-- Datos Población 2 -->
                <div class="col-md-6">
                    <div class="p-3 border rounded bg-light">
                        <h6 class="text-secondary">Población 2</h6>
                        <label>Media (x̄₂)</label>
                        <input type="number" id="media2" class="form-control mb-2" step="any">
                        <label>Varianza (σ₂² o S₂²)</label>
                        <input type="number" id="var2" class="form-control mb-2" step="any">
                        <label>Tamaño (n₂)</label>
                        <input type="number" id="n2" class="form-control" step="any">
                    </div>
                </div>
            </div>

            <hr>
            <!-- Condiciones de la Prueba -->
            <div class="row g-3">
                <div class="col-6">
                    <label>Diferencia Esperada (μ₁ - μ₂)₀</label>
                    <input type="number" id="difCero" class="form-control" value="0" step="any">
                </div>
                <div class="col-6">
                    <label>Nivel de Significancia (α)</label>
                    <input type="number" id="alfa" class="form-control" value="0.05" step="any">
                </div>
                <div class="col-12">
                    <label>Tipo de Prueba (H₁)</label>
                    <select id="tipoPrueba" class="form-select">
                        <option value="distinto">Bilateral (≠)</option>
                        <option value="mayor">Cola Derecha (>)</option>
                        <option value="menor">Cola Izquierda (<)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-4" onclick="calcular()">Calcular los 8 Pasos</button>
        </div>

        <!-- Resultados -->
        <div id="resultados" class="card p-4 d-none">
            <h5 class="text-success mb-3">Solución paso a paso:</h5>
            <div class="result-box" id="outputPasos"></div>
        </div>
    </div>

    <script>
        function calcular() {
            // Recoger datos
            let m1 = parseFloat(document.getElementById('media1').value);
            let v1 = parseFloat(document.getElementById('var1').value);
            let n1 = parseFloat(document.getElementById('n1').value);
            
            let m2 = parseFloat(document.getElementById('media2').value);
            let v2 = parseFloat(document.getElementById('var2').value);
            let n2 = parseFloat(document.getElementById('n2').value);
            
            let dif0 = parseFloat(document.getElementById('difCero').value);
            let alfa = parseFloat(document.getElementById('alfa').value);
            let tipo = document.getElementById('tipoPrueba').value;

            // Validación básica
            if(isNaN(m1) || isNaN(v1) || isNaN(n1) || isNaN(m2) || isNaN(v2) || isNaN(n2)) {
                alert("Por favor, llena todos los campos de las poblaciones.");
                return;
            }

            // Cálculos Estadísticos (Asumiendo muestras grandes o varianza conocida -> Prueba Z)
            let errorEstandar = Math.sqrt((v1 / n1) + (v2 / n2));
            let zCalculado = ((m1 - m2) - dif0) / errorEstandar;
            
            let zCritico, valorP, conclusion, h1Texto, rrTexto;

            // Lógica según el tipo de prueba
            if (tipo === "distinto") {
                h1Texto = "μ₁ - μ₂ ≠ " + dif0;
                zCritico = jStat.normal.inv(1 - alfa/2, 0, 1); // Dos colas
                valorP = 2 * (1 - jStat.normal.cdf(Math.abs(zCalculado), 0, 1));
                rrTexto = `Rechazar H₀ si |Z₀| > ${zCritico.toFixed(3)}`;
                conclusion = (Math.abs(zCalculado) > zCritico) ? "SE RECHAZA H₀" : "NO SE RECHAZA H₀";
            } else if (tipo === "mayor") {
                h1Texto = "μ₁ - μ₂ > " + dif0;
                zCritico = jStat.normal.inv(1 - alfa, 0, 1);
                valorP = 1 - jStat.normal.cdf(zCalculado, 0, 1);
                rrTexto = `Rechazar H₀ si Z₀ > ${zCritico.toFixed(3)}`;
                conclusion = (zCalculado > zCritico) ? "SE RECHAZA H₀" : "NO SE RECHAZA H₀";
            } else {
                h1Texto = "μ₁ - μ₂ < " + dif0;
                zCritico = jStat.normal.inv(alfa, 0, 1);
                valorP = jStat.normal.cdf(zCalculado, 0, 1);
                rrTexto = `Rechazar H₀ si Z₀ < ${zCritico.toFixed(3)}`;
                conclusion = (zCalculado < zCritico) ? "SE RECHAZA H₀" : "NO SE RECHAZA H₀";
            }

            // Construir la salida de los 8 pasos
            let html = `
                <span class="step-title">1) Parámetro:</span> θ = μ₁ - μ₂<br>
                <span class="step-title">2) H₀:</span> μ₁ - μ₂ = ${dif0}<br>
                <span class="step-title">3) H₁:</span> ${h1Texto}<br>
                <span class="step-title">4) α:</span> ${alfa}<br>
                <span class="step-title">5) Estadístico de Prueba:</span> Z₀<br>
                <span class="step-title">6) Región de Rechazo (RR):</span> ${rrTexto}<br>
                <span class="step-title">7) Cálculo:</span><br>
                &nbsp;&nbsp;&nbsp;Z₀ = [(${m1} - ${m2}) - ${dif0}] / √(${v1}/${n1} + ${v2}/${n2})<br>
                &nbsp;&nbsp;&nbsp;Z₀ = ${zCalculado.toFixed(4)}<br>
                &nbsp;&nbsp;&nbsp;Valor p = ${valorP.toFixed(4)}<br>
                <span class="step-title">8) Conclusión:</span> <b>${conclusion}</b> (porque Valor p ${valorP < alfa ? '<' : '>'} α)
            `;

            document.getElementById('outputPasos').innerHTML = html;
            document.getElementById('resultados').classList.remove('d-none');
            
            // Hacer scroll hacia el resultado
            document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
