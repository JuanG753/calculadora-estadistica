<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Estadística Avanzada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; font-size: 0.95rem; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; border: none; }
        .result-box { background-color: #e9ecef; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.05em; overflow-x: auto;}
        .nav-pills .nav-link { border-radius: 8px; margin: 2px; }
    </style>
</head>
<body>
    <div class="container mt-3">
        <h3 class="text-center mb-3 text-primary">Calculadora Estadística</h3>
        
        <!-- Pestañas de Navegación -->
        <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-medias">Medias</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-varianzas">Varianzas</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-potencia">Potencia</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link bg-dark text-white" data-bs-toggle="pill" data-bs-target="#tab-aleatoriedad">Rachas</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link bg-info text-dark fw-bold" data-bs-toggle="pill" data-bs-target="#tab-tablas">Tablas / p-Valor</button></li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            
            <!-- PESTAÑAS 1, 2, 3 y 4 INTACTAS -->
            <div class="tab-pane fade show active" id="tab-medias">
                <div class="card p-3">
                    <h5 class="text-secondary">Diferencia de Medias</h5>
                    <div class="mb-2">
                        <select id="tipoVarianza" class="form-select border-danger">
                            <option value="poblacional">Varianzas Poblacionales Conocidas (Prueba Z)</option>
                            <option value="muestral">Varianzas Muestrales Desconocidas (Prueba T)</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6"><label>Media 1</label><input type="number" id="m1" class="form-control" value="3.75" step="any"></div>
                        <div class="col-6"><label>Media 2</label><input type="number" id="m2" class="form-control" value="2.90" step="any"></div>
                        <div class="col-6"><label>Varianza 1</label><input type="number" id="v1" class="form-control" value="0.0625" step="any"></div>
                        <div class="col-6"><label>Varianza 2</label><input type="number" id="v2" class="form-control" value="0.0625" step="any"></div>
                        <div class="col-6"><label>n 1</label><input type="number" id="n1" class="form-control" value="15" step="any"></div>
                        <div class="col-6"><label>n 2</label><input type="number" id="n2" class="form-control" value="20" step="any"></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4"><label>Dif Esperada</label><input type="number" id="dif0" class="form-control" value="0.80" step="any"></div>
                        <div class="col-4"><label>Alfa (α)</label><input type="number" id="alfa_m" class="form-control" value="0.05" step="any"></div>
                        <div class="col-4"><label>Prueba</label><select id="cola_m" class="form-select"><option value="mayor">></option><option value="menor"><</option><option value="distinto">≠</option></select></div>
                    </div>
                    <button class="btn btn-primary w-100" onclick="calcMedias()">Calcular Medias</button>
                    <div id="res_medias" class="result-box mt-3 d-none"></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-varianzas">
                <div class="card p-3">
                    <h5
