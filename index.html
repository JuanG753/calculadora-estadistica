<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Estadística Avanzada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; font-size: 0.95rem; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; border: none; }
        .result-box { background-color: #e9ecef; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.05em; overflow-x: auto;}
        .nav-pills .nav-link { border-radius: 8px; margin: 2px; }
    </style>
</head>
<body>
    <div class="container mt-3">
        <h3 class="text-center mb-3 text-primary">Calculadora Estadística</h3>
        
        <!-- Pestañas de Navegación -->
        <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-medias">Medias</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-varianzas">Varianzas</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-potencia">Potencia</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link bg-dark text-white" data-bs-toggle="pill" data-bs-target="#tab-aleatoriedad">Rachas</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link bg-info text-dark fw-bold" data-bs-toggle="pill" data-bs-target="#tab-tablas">Tablas / p-Valor</button></li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            
            <!-- PESTAÑA 1: MEDIAS -->
            <div class="tab-pane fade show active" id="tab-medias">
                <div class="card p-3">
                    <h5 class="text-secondary">Diferencia de Medias</h5>
                    <div class="mb-2">
                        <select id="tipoVarianza" class="form-select border-danger">
                            <option value="poblacional">Varianzas Poblacionales Conocidas (Prueba Z)</option>
                            <option value="muestral">Varianzas Muestrales Desconocidas (Prueba T)</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6"><label>Media 1</label><input type="number" id="m1" class="form-control" value="3.75" step="any"></div>
                        <div class="col-6"><label>Media 2</label><input type="number" id="m2" class="form-control" value="2.90" step="any"></div>
                        <div class="col-6"><label>Varianza 1</label><input type="number" id="v1" class="form-control" value="0.0625" step="any"></div>
                        <div class="col-6"><label>Varianza 2</label><input type="number" id="v2" class="form-control" value="0.0625" step="any"></div>
                        <div class="col-6"><label>n 1</label><input type="number" id="n1" class="form-control" value="15" step="any"></div>
                        <div class="col-6"><label>n 2</label><input type="number" id="n2" class="form-control" value="20" step="any"></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4"><label>Dif Esperada</label><input type="number" id="dif0" class="form-control" value="0.80" step="any"></div>
                        <div class="col-4"><label>Alfa (α)</label><input type="number" id="alfa_m" class="form-control" value="0.05" step="any"></div>
                        <div class="col-4"><label>Prueba</label><select id="cola_m" class="form-select"><option value="mayor">></option><option value="menor"><</option><option value="distinto">≠</option></select></div>
                    </div>
                    <button class="btn btn-primary w-100" onclick="calcMedias()">Calcular Medias</button>
                    <div id="res_medias" class="result-box mt-3 d-none"></div>
                </div>
            </div>

            <!-- PESTAÑA 2: VARIANZAS -->
            <div class="tab-pane fade" id="tab-varianzas">
                <div class="card p-3">
                    <h5 class="text-secondary">Pruebas de Varianza</h5>
                    <div class="border p-2 mb-3 rounded">
                        <h6 class="text-primary">1 Población (Chi-Cuadrada)</h6>
                        <div class="row g-2">
                            <div class="col-4"><label>n</label><input type="number" id="chi_n" class="form-control" value="20"></div>
                            <div class="col-4"><label>S²</label><input type="number" id="chi_s2" class="form-control" value="0.006" step="any"></div>
                            <div class="col-4"><label>σ²₀</label><input type="number" id="chi_sigma0" class="form-control" value="0.003" step="any"></div>
                            <div class="col-6"><label>Alfa (α)</label><input type="number" id="chi_alfa" class="form-control" value="0.05" step="any"></div>
                            <div class="col-6"><label>H₁</label><select id="chi_cola" class="form-select"><option value="mayor">Mayor (>)</option><option value="menor">Menor (<)</option></select></div>
                        </div>
                        <button class="btn btn-outline-primary w-100 mt-2" onclick="calcChi()">Calcular Chi²</button>
                        <div id="res_chi" class="result-box mt-2 d-none"></div>
                    </div>
                    <div class="border p-2 rounded">
                        <h6 class="text-success">2 Poblaciones (Fisher F)</h6>
                        <div class="row g-2">
                            <div class="col-6"><label>S² Num</label><input type="number" id="f_s1" class="form-control" value="0.006" step="any"></div>
                            <div class="col-6"><label>S² Denom</label><input type="number" id="f_s2" class="form-control" value="0.004" step="any"></div>
                            <div class="col-6"><label>n Num</label><input type="number" id="f_n1" class="form-control" value="20"></div>
                            <div class="col-6"><label>n Denom</label><input type="number" id="f_n2" class="form-control" value="15"></div>
                            <div class="col-6"><label>Razón (H₀)</label><input type="number" id="f_ratio" class="form-control" value="1.20" step="any"></div>
                            <div class="col-6"><label>Alfa (α)</label><input type="number" id="f_alfa" class="form-control" value="0.05" step="any"></div>
                        </div>
                        <button class="btn btn-outline-success w-100 mt-2" onclick="calcF()">Calcular F</button>
                        <div id="res_f" class="result-box mt-2 d-none"></div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 3: POTENCIA -->
            <div class="tab-pane fade" id="tab-potencia">
                <div class="card p-3">
                    <h5 class="text-secondary">Potencia y Tamaño de Muestra</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-6"><label>Dif Nula (H₀)</label><input type="number" id="p_d0" class="form-control" value="0.80" step="any"></div>
                        <div class="col-6"><label>Dif Real (H₁)</label><input type="number" id="p_d1" class="form-control" value="0.92" step="any"></div>
                        <div class="col-6"><label>Suma Varianzas</label><input type="number" id="p_sumvar" class="form-control" value="0.125" step="any"></div>
                        <div class="col-6"><label>Alfa (α)</label><input type="number" id="p_alfa" class="form-control" value="0.05" step="any"></div>
                    </div>
                    <div class="border p-2 mb-3 rounded">
                        <h6 class="text-info">Calcular Potencia</h6>
                        <label>Tamaño n</label><input type="number" id="p_n" class="form-control mb-2" value="17.14"> 
                        <button class="btn btn-outline-info w-100" onclick="calcPotencia()">Calcular Potencia</button>
                        <div id="res_potencia" class="result-box mt-2 d-none"></div>
                    </div>
                    <div class="border p-2 mb-3 rounded">
                        <h6 class="text-warning">Calcular n</h6>
                        <label>Potencia Deseada</label><input type="number" id="p_potDeseada" class="form-control mb-2" value="0.85" step="any">
                        <button class="btn btn-outline-warning w-100" onclick="calcMuestra()">Calcular Tamaño</button>
                        <div id="res_muestra" class="result-box mt-2 d-none"></div>
                    </div>
                    <div class="border p-2 rounded">
                        <h6 class="text-danger">Probabilidad (Inciso G)</h6>
                        <label>Valor Crítico (Vc)</label><input type="number" id="p_vc" class="form-control mb-2" value="0.95" step="any">
                        <button class="btn btn-outline-danger w-100" onclick="calcIncisoG()">Calcular Probabilidad</button>
                        <div id="res_incisoG" class="result-box mt-2 d-none"></div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 4: ALEATORIEDAD -->
            <div class="tab-pane fade" id="tab-aleatoriedad">
                <div class="card p-3 border-dark">
                    <h5 class="text-dark">Prueba de Rachas</h5>
                    <textarea id="r_datos" class="form-control mb-2" rows="3" placeholder="Ej: 1.2, -0.5, -2.1..."></textarea>
                    <div class="row g-2 mb-3">
                        <div class="col-6"><label>Umbral:</label><select id="r_umbral" class="form-select"><option value="mediana">Mediana</option><option value="cero">Cero</option></select></div>
                        <div class="col-6"><label>Alfa (α)</label><input type="number" id="r_alfa" class="form-control" value="0.05" step="any"></div>
                    </div>
                    <button class="btn btn-dark w-100" onclick="calcRachas()">Evaluar Aleatoriedad</button>
                    <div id="res_rachas" class="result-box mt-3 d-none bg-dark text-light"></div>
                </div>
            </div>

            <!-- PESTAÑA 5: TABLAS Y VALOR P -->
            <div class="tab-
